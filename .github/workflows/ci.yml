name: CI

# Typecheck and production build on every push and pull request. On main this
# runs alongside the changelog job rather than replacing it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Engine tests
        run: npm test

      - name: Typecheck and build
        run: npm run build
